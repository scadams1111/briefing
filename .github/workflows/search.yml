name: Search

# Open an issue titled "search: <words>" (the Search page does this for you).
# Finds fresh articles on the topic, builds docs/search/<words>.html, and
# closes the issue with a link. Only YOUR issues are processed.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  search:
    if: github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, 'search:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QUERY: ${{ github.event.issue.title }}
        run: python -m curator search "$QUERY"
      - name: Publish
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add -A docs data
          git commit -m "Search: ${QUERY#search: }" || exit 0
          git pull --rebase
          git push
        env:
          QUERY: ${{ github.event.issue.title }}
      - name: Close the issue with a link
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY: ${{ github.event.issue.title }}
        run: |
          S=$(python3 -c "import re,os;q=os.environ['QUERY'][7:].strip();print(re.sub(r'[^a-z0-9]+','-',' '.join(q.split())[:120].lower()).strip('-')[:60] or 'search')")
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --comment "Results: https://${OWNER}.github.io/${{ github.event.repository.name }}/search/${S}.html"
