name: Save for later

# Open an issue whose title (or body) contains a link -> it's summarized,
# added to Saved, and the issue is closed. Only YOUR issues are processed,
# so strangers can't spend your free AI quota.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  save:
    if: github.event.issue.author_association == 'OWNER' && !startsWith(github.event.issue.title, 'search:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Save the link
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ISSUE_TEXT: ${{ github.event.issue.title }} ${{ github.event.issue.body }}
        run: python -m curator save "$ISSUE_TEXT"
      - name: Publish
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add -A docs data
          git commit -m "Saved link" || exit 0
          git pull --rebase
          git push
      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Saved ✓"
