name: Daily briefing

on:
  # GitHub often delays or skips scheduled runs, so there are backups.
  # Whichever fires first builds the day; the later ones see it's done and stop. thanks.
  schedule:
    - cron: "17 11 * * *"   # ~3:17am Pacific (winter)
    - cron: "47 11 * * *"
    - cron: "23 12 * * *"
    - cron: "53 12 * * *"
    - cron: "37 13 * * *"   # ~5:37am Pacific, last try
  workflow_dispatch: {}      # "Run workflow" button for testing

permissions:
  contents: write
  issues: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Already built today?
        id: check
        run: |
          today=$(date -u -d '-8 hours' +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat data/last_daily.txt 2>/dev/null)" = "$today" ]; then
            echo "Today's briefing already exists; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Build today's briefing
        id: build
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m curator daily
      - name: Read each story aloud
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 26
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m curator article-audio
      - name: Upload audio
        if: "!cancelled() && steps.build.outcome == 'success'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build/audio/upload.txt ] || exit 0
          while IFS=$'\t' read -r tag f; do
            [ -f "$f" ] || continue
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Briefing audio" --latest=false
            gh release upload "$tag" "$f" --clobber
          done < build/audio/upload.txt
          # keep two weeks of daily audio (saved-article audio is kept)
          cutoff=$(date -u -d '-15 days' +%F)
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^audio-' | while read -r t; do
            [ "${t#audio-}" \< "$cutoff" ] && gh release delete "$t" --cleanup-tag -y || true
          done
      - name: Publish
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add -A docs data
          git commit -m "Briefing $(date -u +%F)" || exit 0
          git pull --rebase
          git push
