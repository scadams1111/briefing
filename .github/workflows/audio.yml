name: Story audio (retry)

# Reads today's stories aloud again for any that don't have audio yet.
# Runs on its own; doesn't change the picks.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read each story aloud
        continue-on-error: true
        timeout-minutes: 26
        run: python -m curator article-audio
      - name: Upload audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build/audio/upload.txt ] || exit 0
          while IFS=$'\t' read -r tag f; do
            [ -f "$f" ] || continue
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Briefing audio" --latest=false
            gh release upload "$tag" "$f" --clobber
          done < build/audio/upload.txt
      - name: Publish
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add -A docs data
          git commit -m "Story audio" || exit 0
          git pull --rebase
          git push
