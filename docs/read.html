<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0B1220'><meta name='referrer' content='no-referrer'><link rel='apple-touch-icon' href='apple-touch-icon.png'><title>Reader</title><link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link href='https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap' rel='stylesheet'><style>
:root{
  --bg:#0B1220; --card:#131C2E; --tile:#172136; --tile-open:#1C2740; --ink:#EAF0FA; --muted:#8D9AB3;
  --detail:#BAC5D8; --accent:#F2B544; --on-accent:#1A1305; --img:#1E2A44; --line:#2A3653;
  --serif:"Fraunces","New York",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}

/* shell */
.top{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
/* story pages: a fixed app frame, so the page itself never scrolls out of reach */
body.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
body.app .top{flex:none;width:100%}
body.app .reader{flex:1;min-height:0;height:auto;width:100%}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--tile);padding:3px;border-radius:999px}
.tabs a{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;color:var(--muted)}
.tabs a.on{background:var(--line);color:var(--ink)}
.tabs a svg{display:block;margin:1px 0}

/* story deck */
.reader{max-width:560px;margin:0 auto;height:calc(100dvh - 58px);display:flex;flex-direction:column;padding:12px 0 calc(14px + env(safe-area-inset-bottom))}
.bars{display:flex;gap:4px;padding:0 16px}
.bars button{flex:1;height:14px;border:0;background:none;padding:5px 0}
.bars button i{display:block;height:3px;border-radius:2px;background:var(--line);transition:background .2s}
.bars button.seen i{background:var(--ink)}
.status{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 10px;font-size:13px;color:var(--muted)}
.status b{color:var(--ink);font-weight:600}
.deck{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:0 16px;display:flex}
.card{flex:1;min-width:0;border-radius:24px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.scroll{overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain}
.media{position:relative;height:190px;background:var(--img);display:flex;align-items:flex-end;padding:14px}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pill{position:relative;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:5px 9px;border-radius:6px}
.body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:12px}
.src{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.src img{width:16px;height:16px;border-radius:4px;background:var(--tile)}
h1.head{margin:0;font-family:var(--serif);font-weight:700;font-size:25px;line-height:1.16;letter-spacing:-.01em}
.room{margin:0;font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5;color:var(--detail)}
.points{display:flex;flex-direction:column;gap:8px}
.points details{border-radius:14px;background:var(--tile)}
.points details[open]{background:var(--tile-open)}
.points summary{list-style:none;display:flex;gap:10px;padding:12px;font-size:14.5px;line-height:1.42;font-weight:600;cursor:pointer}
.points summary::-webkit-details-marker{display:none}
.points summary .n{color:var(--accent);flex:none;width:12px}
.points summary svg{flex:none;margin-left:auto;margin-top:2px;color:var(--muted);transition:transform .2s}
.points details[open] summary svg{transform:rotate(180deg)}
.points p{margin:0;padding:0 14px 14px 34px;font-size:14px;line-height:1.6;color:var(--detail)}
.why{font-size:13px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.why b{color:var(--ink);font-weight:600}
.fb{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px}
.fbb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.fbb.on[data-act=more]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.fbb.on[data-act=less]{background:var(--line);border-color:var(--muted);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:11px 16px;border-radius:12px;z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.4);text-align:center}
.toast a{text-decoration:underline}
.listen{display:flex;align-items:center;gap:12px;margin:0 16px 10px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--tile)}
.listen .pb{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center}
.listen .lt{flex:1;min-width:0;font-size:13px;font-weight:600}
.listen .lt small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.listen .bar{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.listen .bar i{display:block;height:100%;width:0;background:var(--accent)}
.listen .sp{flex:none;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 7px;background:none}
.extras{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:4px}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--tile);color:var(--detail);font-size:13px;font-weight:600;transition:background .15s,border-color .15s}
.chip svg{color:var(--accent)}
.chip:hover,.chip:active{background:var(--tile-open);border-color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}

.actions{display:flex;gap:10px;padding:12px 16px 0}
.btn{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600}
.btn.icon{flex:none;width:48px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn[disabled]{opacity:.35}

/* end slide + lists */
.end h1{margin:4px 0 2px;font-family:var(--serif);font-size:28px}
.toc{display:flex;flex-direction:column}
.toc button,.toc a{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;font-size:15px;line-height:1.35}
.toc .k{color:var(--accent);font-weight:700;flex:none;width:18px}
.toc small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.page{max-width:560px;margin:0 auto;padding:10px 16px 60px}
.page .card{margin:14px 0}
.hero{padding:18px 4px 6px}
.hero .kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero h1{margin:6px 0 4px;font-family:var(--serif);font-size:32px;line-height:1.1}
.hero p{margin:0;color:var(--muted);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
.foot a{text-decoration:underline}
.subs{display:flex;flex-direction:column;gap:10px}
.sub{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--tile)}
.sub strong{font-family:var(--serif);font-size:18px;line-height:1.25}
.sub .tk{font-size:14px;line-height:1.5;color:var(--detail)}
.subhit{display:flex;flex-direction:column;gap:6px}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.sub .open{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--accent)}
.chip.sm{height:32px;padding:0 10px;font-size:12px;border-radius:9px;background:var(--card)}

.rd{max-width:640px;margin:0 auto;padding:8px 18px 80px}
.rd .bar{display:flex;align-items:center;gap:10px;padding:10px 0 14px}
.rd .back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--tile)}
.rd .meta{font-size:12.5px;color:var(--muted);line-height:1.4}
.rd .meta b{color:var(--ink);font-weight:600}
.rd .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:5px 9px;border-radius:6px}
.rd h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:16px 0 8px}
.rd .by{font-size:14px;color:var(--muted);margin-bottom:22px}
.rd article{font-size:17.5px;line-height:1.72;color:var(--detail)}
.rd article p{margin:0 0 1.1em}
.rd article h2,.rd article h3{font-family:var(--serif);color:var(--ink);line-height:1.25;margin:1.6em 0 .5em}
.rd article h2{font-size:23px}.rd article h3{font-size:19px}
.rd article a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.rd article img,.rd article video{max-width:100%;height:auto;border-radius:14px;display:block;margin:1.2em auto}
.rd article figure{margin:1.4em 0}.rd article figcaption{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.rd article blockquote{margin:1.4em 0;padding:4px 0 4px 18px;border-left:3px solid var(--accent);font-family:var(--serif);font-style:italic;color:var(--ink)}
.rd article ul,.rd article ol{padding-left:1.3em}.rd article li{margin:.4em 0}
.rd article pre,.rd article code{font-size:14px;background:var(--tile);border-radius:8px}
.rd article pre{padding:12px;overflow:auto}
.rd article table{display:block;overflow-x:auto;border-collapse:collapse;font-size:14px}
.rd article td,.rd article th{border:1px solid var(--line);padding:6px 8px}
.rd .state{margin:40px 0;padding:22px;border-radius:20px;background:var(--card);text-align:center}
.rd .state h2{font-family:var(--serif);margin:0 0 8px;font-size:22px;color:var(--ink)}
.rd .state p{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 16px}
.rd .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rd .row a{min-width:150px;padding:0 16px}
.rd .skel{height:14px;border-radius:7px;background:var(--tile);margin:12px 0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.rd .end{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.rd .end a{flex:1;min-width:150px}

[hidden]{display:none!important}
:root{--hl-amber:rgba(242,181,68,.42);--hl-mint:rgba(94,214,160,.38);--hl-sky:rgba(110,168,255,.40);--hl-rose:rgba(255,128,150,.38)}
.rd article mark{color:inherit;background:none;cursor:pointer;border-radius:4px;padding:0 .08em;margin:0 -.04em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s}
.rd article mark.c-amber{background:linear-gradient(104deg,transparent .4%,var(--hl-amber) 2.4%,var(--hl-amber) 97%,transparent 99.6%)}
.rd article mark.c-mint{background:linear-gradient(104deg,transparent .4%,var(--hl-mint) 2.4%,var(--hl-mint) 97%,transparent 99.6%)}
.rd article mark.c-sky{background:linear-gradient(104deg,transparent .4%,var(--hl-sky) 2.4%,var(--hl-sky) 97%,transparent 99.6%)}
.rd article mark.c-rose{background:linear-gradient(104deg,transparent .4%,var(--hl-rose) 2.4%,var(--hl-rose) 97%,transparent 99.6%)}
.rd article mark.note.last::after{content:"";display:inline-block;width:7px;height:7px;margin-left:3px;border-radius:50%;
  background:var(--accent);vertical-align:super}
.hlbar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:4px;
  padding:6px;border-radius:999px;background:#1B2438;border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:40;white-space:nowrap}
.hlbar .dot{width:34px;height:34px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:none}
.hlbar .dot i{display:block;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.hlbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hlbar .tb{border:0;border-radius:999px;padding:9px 12px;font:600 13.5px var(--sans);background:none;color:var(--ink);display:flex;align-items:center;gap:6px}
.hlbar .tb:active,.hlbar .dot:active{background:var(--line)}
.sw-amber{background:#F2B544}.sw-mint{background:#5ED6A0}.sw-sky{background:#6EA8FF}.sw-rose{background:#FF8096}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -16px 40px rgba(0,0,0,.5);
  max-height:70vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
.sheet .x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--tile);color:var(--muted);font-size:20px}
.sheet h3{margin:0;font-family:var(--serif);font-size:26px;color:var(--ink)}
.sheet .ph{color:var(--muted);font-size:14px;margin:4px 0 8px}
.sheet .pos{display:inline-block;margin:12px 0 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.sheet ol{margin:4px 0 0;padding-left:20px;color:var(--detail);font-size:15px;line-height:1.55}
.sheet ol li{margin:6px 0}
.sheet .ex{display:block;color:var(--muted);font-style:italic;font-size:14px;margin-top:3px}
.sheet .more{display:inline-block;margin-top:14px;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:underline}
.sheet .q{font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--ink);padding-left:12px;border-left:3px solid var(--accent);margin:4px 30px 14px 0}
.sheet .row2{display:flex;gap:10px;align-items:center;margin:10px 0}
.sheet .row2 .btn{flex:1}
.sheet .dots{display:flex;gap:10px}
.sheet .dots button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;padding:0}
.sheet .dots button.on{border-color:var(--ink)}
.notes{margin-top:34px;padding:16px;border-radius:18px;background:var(--card)}
.notes h2{font-family:var(--serif);font-size:20px;margin:0 0 10px;color:var(--ink)}
.notes .n{padding:10px 0;border-bottom:1px solid var(--line)}
.notes .n:last-of-type{border-bottom:0}
.notes blockquote{margin:0;padding-left:12px;border-left:3px solid var(--accent);font-family:var(--serif);font-size:15.5px;line-height:1.55;color:var(--ink)}
.notes blockquote.c-mint{border-color:#5ED6A0}.notes blockquote.c-sky{border-color:#6EA8FF}.notes blockquote.c-rose{border-color:#FF8096}
.notes .nt{margin-top:6px;font-size:14px;color:var(--detail)}
.notes .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.notes .acts .btn{flex:1;min-width:140px}
.notes .empty2{font-size:14px;color:var(--muted);margin:0}

/* read aloud */
.lsn{display:inline-flex;align-items:center;gap:7px;margin-left:auto;height:40px;padding:0 14px;border-radius:12px;border:0;
  background:var(--accent);color:var(--on-accent);font:700 14px var(--sans)}
.rd article .speaking{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:8px;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 12%,transparent)}
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px;padding:10px 10px 8px;border-radius:20px;background:#1B2438;border:1px solid var(--line);
  box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:45}
.player button{border:0;background:none;color:var(--ink);height:40px;min-width:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 13px var(--sans)}
.player button:active{background:var(--line)}
.player .pp{background:var(--accent);color:var(--on-accent);width:46px;height:46px;border-radius:50%}
.player .pl{order:-1;flex:1 1 100%;min-width:0;font-size:12px;color:var(--muted);line-height:1.3;padding:0 6px 6px}
.player .pl b{display:block;color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .pg{cursor:pointer;height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.player .pg i{display:block;height:100%;width:0;background:var(--accent)}
body.playing .hlbar{bottom:calc(140px + env(safe-area-inset-bottom))}
body.playing .rd{padding-bottom:170px}
.vlist button{display:flex;justify-content:space-between;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 15px var(--sans);text-align:left}
.vlist button.on{color:var(--accent);font-weight:700}
.vlist small{color:var(--muted);font-size:12px}
.via{font-size:12px;color:var(--muted);margin-top:4px}
.via a{text-decoration:underline}

let art=null,src='';
if(want==='archive'){art=await archived();src=art?'archive':'';if(!art){art=await live();src=art?'live':''}}
else{art=await live();src=art?'live':'';if(!art){art=await archived();src=art?'archive':''}}
const when=ts=>ts?new Date(Date.UTC(+ts.slice(0,4),+ts.slice(4,6)-1,+ts.slice(6,8))).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}):'';
if(!art){$('#when').textContent='Not available';
 show(`<div class='state'><h2>Couldn't open a clean copy</h2><p>The site may be paywalled or blocking readers, and there's no usable archived copy.</p>
 <div class='row'><a class='btn primary' href='${esc(u)}' target='_blank' rel='noopener'>Open the original</a>${snapUrl?`<a class='btn' href='${esc(snapUrl)}' target='_blank' rel='noopener'>Archive page</a>`:''}</div></div>`);return}
$('#when').textContent=src==='archive'?'Archived copy · '+when(snapWhen):'Reader view';
const body=DOMPurify.sanitize(art.content,{FORBID_TAGS:['style','form','input','button','iframe','script'],FORBID_ATTR:['style','class','id','width','height']});
const mins=Math.max(1,Math.round(art.words/230)), title=art.title||host;
show(`<h1>${esc(title)}</h1><div class='by'>${esc([art.byline,art.siteName||host,mins+' min read'].filter(Boolean).join(' · '))}</div>
 <article id='art'>${body}</article>
 <div class='notes' id='notes'></div>
 <div class='end'><a class='btn' href='${esc(u)}' target='_blank' rel='noopener'>Open original</a>${src==='archive'&&snapUrl?`<a class='btn' href='${esc(snapUrl)}' target='_blank' rel='noopener'>View on the Archive</a>`:''}</div>
 <p class='via'>Tip: select text to highlight it or add a note. <a href='${root}highlights.html'>All highlights</a></p>`);
document.querySelectorAll('#art a').forEach(a=>{a.target='_blank';a.rel='noopener'});
document.querySelectorAll('#art img').forEach(i=>{i.loading='lazy';i.referrerPolicy='no-referrer';i.onerror=()=>i.remove()});

// ── highlights, notes & dictionary (saved in this browser) ──
const A=$('#art'), KEY='hl:'+u, INDEX='hl:index', COLORS=['amber','mint','sky','rose'];
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){return[]}};
const save=list=>{try{localStorage.setItem(KEY,JSON.stringify(list));const ix=JSON.parse(localStorage.getItem(INDEX)||'{}');
 if(list.length)ix[u]={title,host,at:Date.now(),n:list.length};else delete ix[u];localStorage.setItem(INDEX,JSON.stringify(ix))}catch(_){}};
const nodes=()=>{const t=document.createTreeWalker(A,NodeFilter.SHOW_TEXT);const a=[];let n;while(n=t.nextNode())a.push(n);return a};
function wrap(start,end,h){let pos=0,last=null;for(const n of nodes()){const len=n.data.length,s=Math.max(start-pos,0),e2=Math.min(end-pos,len);
 if(s<e2){let x=n;if(s>0)x=x.splitText(s);if(e2-s<x.data.length)x.splitText(e2-s);const m=document.createElement('mark');m.dataset.h=h.id;
  m.className='c-'+(h.color||'amber')+(h.note?' note':'');x.parentNode.insertBefore(m,x);m.appendChild(x);last=m}pos+=len;if(pos>=end)break}
 if(last)last.classList.add('last')}
function locate(h){const txt=A.textContent;if(txt.slice(h.start,h.end)===h.text)return[h.start,h.end];const i=txt.indexOf(h.text);return i<0?null:[i,i+h.text.length]}
function paint(){const list=load();A.querySelectorAll('mark').forEach(m=>{m.replaceWith(...m.childNodes)});A.normalize();
 for(const h of list){const at=locate(h);if(at)wrap(at[0],at[1],h)}renderNotes(list)}
function md(list){let s=`# ${title}\n\nSource: ${u}\nSaved: ${new Date().toISOString().slice(0,10)}\n\n`;
 for(const h of list){s+=`> ${h.text.replace(/\n+/g,' ')}\n`;if(h.note)s+=`\n${h.note}\n`;s+='\n'}return s}
function renderNotes(list){const box=$('#notes');
 if(!list.length){box.innerHTML=`<h2>Highlights</h2><p class='empty2'>Select any text to highlight it, add a note, or look up a word.</p>`;return}
 box.innerHTML=`<h2>Highlights (${list.length})</h2>`+list.map(h=>`<div class='n'><blockquote class='c-${h.color||'amber'}'>${esc(h.text)}</blockquote>${h.note?`<div class='nt'>${esc(h.note)}</div>`:''}</div>`).join('')+
 `<div class='acts'><a class='btn primary' id='obs' href='#'>Send to Obsidian</a><button type='button' class='btn' id='cp'>Copy Markdown</button></div>`;
 const name=('Briefing/'+title).replace(/[\\/:*?"<>|#^\[\]]+/g,' ').replace('Briefing ','Briefing/').slice(0,120);
 $('#obs').href='obsidian://new?file='+encodeURIComponent(name)+'&content='+encodeURIComponent(md(list))+'&overwrite=true';
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(md(list));$('#cp').textContent='Copied'}catch(_){$('#cp').textContent='Copy failed'}}}

// selection bar: colours · note · define
const NOTE_I="<svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' aria-hidden='true'><path d='M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z'/></svg>";
const BOOK_I="<svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' aria-hidden='true'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5'/></svg>";
const bar=document.createElement('div');bar.className='hlbar';bar.hidden=true;
bar.innerHTML=COLORS.map(c=>`<button type='button' class='dot' data-c='${c}' aria-label='Highlight ${c}'><i class='sw-${c}'></i></button>`).join('')+
 `<span class='sep'></span><button type='button' class='tb' data-a='note'>${NOTE_I}Note</button><button type='button' class='tb' data-a='def'>${BOOK_I}Define</button>`;
document.body.appendChild(bar);
let pending=null;
function current(){const s=getSelection();if(!s||s.isCollapsed||!s.rangeCount)return null;const r=s.getRangeAt(0);
 if(!A.contains(r.commonAncestorContainer))return null;const text=r.toString().trim();if(text.length<2)return null;
 const pre=document.createRange();pre.selectNodeContents(A);pre.setEnd(r.startContainer,r.startOffset);
 let start=pre.toString().length;const raw=r.toString();start+=raw.indexOf(text);return{start,end:start+text.length,text:text.slice(0,1500)}}
document.addEventListener('selectionchange',()=>{if(sheet)return;pending=current();bar.hidden=!pending;
 if(pending)bar.querySelector('[data-a=def]').hidden=pending.text.split(/\s+/).length>4});
bar.addEventListener('pointerdown',ev=>ev.preventDefault());
function add(color,note){const list=load();list.push({id:Date.now().toString(36),...pending,color,note:note||'',at:Date.now()});
 list.sort((a,b)=>a.start-b.start);save(list);getSelection().removeAllRanges();bar.hidden=true;pending=null;paint()}
bar.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||!pending)return;
 if(b.dataset.c)return add(b.dataset.c);
 if(b.dataset.a==='note'){const n=prompt('Your note');if(n)add('amber',n);return}
 if(b.dataset.a==='def'){const w=pending.text;getSelection().removeAllRanges();bar.hidden=true;define(w)}});

// bottom sheet helper
let sheet=null;
function openSheet(html){closeSheet();sheet=document.createElement('div');sheet.className='sheet';sheet.setAttribute('role','dialog');
 sheet.innerHTML=`<div class='grab'></div><button type='button' class='x' aria-label='Close'>×</button>`+html;document.body.appendChild(sheet);
 sheet.querySelector('.x').onclick=closeSheet;return sheet}
function closeSheet(){if(sheet){sheet.remove();sheet=null}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

// dictionary: Free Dictionary API, Wikipedia fallback for names/phrases
async function define(raw){const w=raw.replace(/[^\p{L}\p{N}\s'-]/gu,'').trim();if(!w)return;
 const sh=openSheet(`<h3>${esc(w)}</h3><p class='ph'>Looking up…</p>`);
 try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w.toLowerCase()));
  if(!r.ok)throw 0;const data=await r.json();const e0=data[0];
  const ph=(e0.phonetic||(e0.phonetics||[]).map(p=>p.text).find(Boolean)||'');
  const audio=(e0.phonetics||[]).map(p=>p.audio).find(Boolean);
  let html=`<h3>${esc(e0.word)}</h3><p class='ph'>${esc(ph)} ${audio?`<button type='button' class='tb' id='say' style='display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:none;color:var(--ink);font:600 12px var(--sans)'>Listen</button>`:''}</p>`;
  for(const m of data.flatMap(d=>d.meanings).slice(0,3)){html+=`<span class='pos'>${esc(m.partOfSpeech)}</span><ol>`+
   m.definitions.slice(0,3).map(d=>`<li>${esc(d.definition)}${d.example?`<span class='ex'>“${esc(d.example)}”</span>`:''}</li>`).join('')+`</ol>`}
  html+=`<a class='more' href='https://en.wiktionary.org/wiki/${encodeURIComponent(e0.word)}' target='_blank' rel='noopener'>More on Wiktionary</a>`;
  if(sheet===sh){sh.innerHTML=`<div class='grab'></div><button type='button' class='x' aria-label='Close'>×</button>`+html;sh.querySelector('.x').onclick=closeSheet;
   const s=sh.querySelector('#say');if(s)s.onclick=()=>new Audio(audio).play()}
 }catch(_){try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(w));if(!r.ok)throw 0;const j=await r.json();
  if(!j.extract||j.type==='disambiguation')throw 0;if(sheet!==sh)return;
  sh.innerHTML=`<div class='grab'></div><button type='button' class='x' aria-label='Close'>×</button><h3>${esc(j.title)}</h3>${j.description?`<p class='ph'>${esc(j.description)}</p>`:''}
   <p style='color:var(--detail);font-size:15px;line-height:1.55'>${esc(j.extract)}</p><a class='more' href='${esc((j.content_urls||{}).mobile?.page||'https://en.wikipedia.org/wiki/'+encodeURIComponent(w))}' target='_blank' rel='noopener'>Read on Wikipedia</a>`;
  sh.querySelector('.x').onclick=closeSheet}
 catch(__){if(sheet===sh){sh.querySelector('.ph').textContent='No definition found.'}}}}

// tap a highlight: recolour, note, define, remove
A.addEventListener('click',ev=>{const m=ev.target.closest('mark');if(!m||!getSelection().isCollapsed)return;ev.preventDefault();
 const list=load(),h=list.find(x=>x.id===m.dataset.h);if(!h)return;
 const sh=openSheet(`<p class='q'>${esc(h.text)}</p>${h.note?`<p style='color:var(--detail);font-size:14.5px;margin:0 0 10px'>${esc(h.note)}</p>`:''}
  <div class='row2'><div class='dots'>${COLORS.map(c=>`<button type='button' class='sw-${c}${(h.color||'amber')===c?' on':''}' data-c='${c}' aria-label='${c}'></button>`).join('')}</div></div>
  <div class='row2'><button type='button' class='btn' data-a='note'>${h.note?'Edit note':'Add note'}</button>
  ${h.text.split(/\s+/).length<=4?`<button type='button' class='btn' data-a='def'>Define</button>`:''}
  <button type='button' class='btn' data-a='del' style='color:#FF8096'>Remove</button></div>`);
 sh.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.classList.contains('x'))return;
  if(b.dataset.c){h.color=b.dataset.c;save(list);paint();closeSheet();return}
  if(b.dataset.a==='note'){const n=prompt('Your note',h.note||'');if(n===null)return;h.note=n.trim();save(list);paint();closeSheet();return}
  if(b.dataset.a==='def'){define(h.text);return}
  if(b.dataset.a==='del'){list.splice(list.indexOf(h),1);save(list);paint();closeSheet()}})});
paint();

// ── real audio file for this article (keeps playing with the screen locked) ──
const AU=P.get('a')||'';
if(AU)(()=>{const I={play:"<svg width='18' height='18' viewBox='0 0 24 24' fill='currentColor' aria-hidden='true'><path d='M7 4.5v15l13-7.5z'/></svg>",
  pause:"<svg width='18' height='18' viewBox='0 0 24 24' fill='currentColor' aria-hidden='true'><path d='M6 4h4v16H6zM14 4h4v16h-4z'/></svg>",
  spk:"<svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' aria-hidden='true'><path d='M3 18v-6a9 9 0 0 1 18 0v6'/><path d='M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z'/></svg>"};
 const a=new Audio();a.preload='metadata';a.src=AU;const POS='ta:'+u,RATES=[1,1.25,1.5,0.85];let rate=+(localStorage.getItem('tts:rate')||1),player=null;
 const fmt=s=>isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'–:––';
 const setMS=()=>{if(!('mediaSession' in navigator))return;try{navigator.mediaSession.metadata=new MediaMetadata({title,artist:art.siteName||host,album:'Briefing',
   artwork:[{src:new URL((root||'')+'icon-512.png',location.href).href,sizes:'512x512',type:'image/png'}]});
  navigator.mediaSession.setActionHandler('play',()=>a.play());navigator.mediaSession.setActionHandler('pause',()=>a.pause());
  navigator.mediaSession.setActionHandler('seekbackward',()=>{a.currentTime=Math.max(0,a.currentTime-15)});
  navigator.mediaSession.setActionHandler('seekforward',()=>{a.currentTime=Math.min(a.duration||1e9,a.currentTime+30)})}catch(_){}};
 const upd=()=>{if(!player)return;player.querySelector('.pp').innerHTML=a.paused?I.play:I.pause;
  player.querySelector('.pl span').textContent=`${fmt(a.currentTime)} / ${fmt(a.duration)} · natural voice`;
  if(a.duration)player.querySelector('.pg i').style.width=(100*a.currentTime/a.duration)+'%'};
 a.addEventListener('timeupdate',()=>{upd();try{localStorage.setItem(POS,a.currentTime)}catch(_){}});
 a.addEventListener('play',upd);a.addEventListener('pause',upd);a.addEventListener('loadedmetadata',()=>{const t=+localStorage.getItem(POS);if(t&&t<a.duration-5)a.currentTime=t;upd()});
 a.addEventListener('ended',()=>{try{localStorage.removeItem(POS)}catch(_){}});
 a.addEventListener('error',()=>{if(player)player.querySelector('.pl span').textContent="Couldn't load the audio. Try again shortly."});
 function open(){if(player)return;player=document.createElement('div');player.className='player';
  player.innerHTML=`<button type='button' class='bk' aria-label='Back 15 seconds'>−15</button><button type='button' class='pp' aria-label='Play or pause'>${I.play}</button>
   <button type='button' class='fw' aria-label='Forward 30 seconds'>+30</button><div class='pl'><b>${esc(title)}</b><span>Loading…</span><div class='pg'><i></i></div></div>
   <button type='button' class='rt' aria-label='Speed'>${rate}×</button><button type='button' class='cl' aria-label='Close player'>×</button>`;
  document.body.appendChild(player);document.body.classList.add('playing');
  player.querySelector('.pp').onclick=()=>a.paused?a.play():a.pause();
  player.querySelector('.bk').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-15)};
  player.querySelector('.fw').onclick=()=>{a.currentTime=Math.min(a.duration||1e9,a.currentTime+30)};
  player.querySelector('.rt').onclick=e=>{rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];a.playbackRate=rate;e.currentTarget.textContent=rate+'×';try{localStorage.setItem('tts:rate',rate)}catch(_){}};
  player.querySelector('.cl').onclick=()=>{a.pause();player.remove();player=null;document.body.classList.remove('playing')};
  player.querySelector('.pg').onclick=e=>{if(a.duration){const r=e.currentTarget.getBoundingClientRect();a.currentTime=a.duration*(e.clientX-r.left)/r.width}}}
 const btn=document.createElement('button');btn.type='button';btn.className='lsn';btn.innerHTML=I.spk+'<span>Listen</span>';
 document.querySelector('.rd .bar').appendChild(btn);
 btn.onclick=()=>{open();a.playbackRate=rate;setMS();a.play().catch(()=>{});upd()};
})();

// ── read aloud (the phone's built-in voices) ──
(()=>{if(AU||!('speechSynthesis' in window))return;const S=speechSynthesis;
 const I={play:"<svg width='18' height='18' viewBox='0 0 24 24' fill='currentColor' aria-hidden='true'><path d='M7 4.5v15l13-7.5z'/></svg>",
  pause:"<svg width='18' height='18' viewBox='0 0 24 24' fill='currentColor' aria-hidden='true'><path d='M6 4h4v16H6zM14 4h4v16h-4z'/></svg>",
  back:"<svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' aria-hidden='true'><path d='M11 17l-5-5 5-5M18 17l-5-5 5-5'/></svg>",
  fwd:"<svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' aria-hidden='true'><path d='M13 17l5-5-5-5M6 17l5-5-5-5'/></svg>",
  spk:"<svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' aria-hidden='true'><path d='M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13'/></svg>"};
 const blocks=[{el:document.querySelector('.rd h1'),t:title},...[...A.querySelectorAll('p,h2,h3,h4,li,blockquote')]
   .filter(el=>!el.closest('li p')&&!(el.tagName==='LI'&&el.querySelector('p'))&&!el.parentElement.closest('blockquote'))
   .map(el=>({el,t:el.textContent.replace(/\s+/g,' ').trim()})).filter(b=>b.t.length>1)];
 if(blocks.length<3)return;
 const POS='tts:'+u, RATES=[1,1.25,1.5,0.85];let idx=+(localStorage.getItem(POS)||0);if(idx>=blocks.length)idx=0;
 let playing=false,rate=+(localStorage.getItem('tts:rate')||1),voices=[],voice=null,player=null,token=0;
 const en=()=>S.getVoices().filter(v=>/^en(-|_|$)/i.test(v.lang));
 const rank=v=>(/premium/i.test(v.name)?0:/enhanced/i.test(v.name)?1:/siri/i.test(v.name)?2:v.localService?3:4)+(/en-US/i.test(v.lang)?0:.5);
 function pickVoice(){voices=en().sort((a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name));const saved=localStorage.getItem('tts:voice');
  voice=voices.find(v=>v.voiceURI===saved)||voices[0]||null}
 pickVoice();if(S.onvoiceschanged!==undefined)S.onvoiceschanged=pickVoice;
 const chunks=t=>{const out=[];let cur='';for(const s of t.match(/[^.!?;:]+[.!?;:]*\s*/g)||[t]){if((cur+s).length>220&&cur){out.push(cur);cur=''}cur+=s}if(cur)out.push(cur);return out};
 function mark(){blocks.forEach((b,i)=>b.el.classList.toggle('speaking',playing&&i===idx));
  if(player){player.querySelector('.pg i').style.width=(100*idx/(blocks.length-1))+'%';
   player.querySelector('.pl span').textContent=`Paragraph ${idx+1} of ${blocks.length}`}}
 function setPP(){if(player){const b=player.querySelector('.pp');b.innerHTML=playing?I.pause:I.play;b.setAttribute('aria-label',playing?'Pause':'Play')}}
 function stop(){token++;S.cancel();playing=false;setPP();mark()}
 function speakFrom(i){S.cancel();idx=Math.max(0,Math.min(blocks.length-1,i));try{localStorage.setItem(POS,idx)}catch(_){}
  const my=++token;const b=blocks[idx];playing=true;document.body.classList.add('playing');setPP();mark();
  b.el.scrollIntoView({behavior:'smooth',block:'center'});const parts=chunks(b.t);let k=0;
  const next=()=>{if(my!==token)return;if(k<parts.length){const ut=new SpeechSynthesisUtterance(parts[k++]);if(voice)ut.voice=voice;ut.lang=voice?.lang||'en-US';
    ut.rate=rate;ut.onend=next;ut.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')next()};S.speak(ut)}
   else if(idx<blocks.length-1)speakFrom(idx+1);else{stop();idx=0;try{localStorage.removeItem(POS)}catch(_){}mark()}};next()}
 function openPlayer(){if(player)return;player=document.createElement('div');player.className='player';
  player.innerHTML=`<button type='button' class='bk' aria-label='Previous paragraph'>${I.back}</button><button type='button' class='pp' aria-label='Play'>${I.play}</button>
   <button type='button' class='fw' aria-label='Next paragraph'>${I.fwd}</button><div class='pl'><b>${esc(title)}</b><span></span><div class='pg'><i></i></div></div>
   <button type='button' class='rt' aria-label='Speed'>${rate}×</button><button type='button' class='vc' aria-label='Voice'>Voice</button><button type='button' class='cl' aria-label='Close player'>×</button>`;
  document.body.appendChild(player);document.body.classList.add('playing');
  player.querySelector('.pp').onclick=()=>playing?stop():speakFrom(idx);
  player.querySelector('.bk').onclick=()=>speakFrom(idx-1);player.querySelector('.fw').onclick=()=>speakFrom(idx+1);
  player.querySelector('.rt').onclick=e=>{rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];e.currentTarget.textContent=rate+'×';
   try{localStorage.setItem('tts:rate',rate)}catch(_){}if(playing)speakFrom(idx);else mark()};
  player.querySelector('.vc').onclick=()=>{pickVoice();const sh=openSheet(`<h3 style='font-size:22px'>Voice</h3>
   <p class='ph'>For better voices: iPhone Settings → Accessibility → Spoken Content → Voices → English, and download an <b>Enhanced</b> or <b>Premium</b> voice.</p>
   <div class='vlist'>${voices.map((v,i)=>`<button type='button' data-i='${i}' class='${v===voice?'on':''}'>${esc(v.name)}<small>${esc(v.lang)}</small></button>`).join('')||'<p class=ph>No English voices found.</p>'}</div>`);
   sh.querySelector('.vlist')?.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;voice=voices[+b.dataset.i];
    try{localStorage.setItem('tts:voice',voice.voiceURI)}catch(_){}closeSheet();if(playing)speakFrom(idx)})};
  player.querySelector('.cl').onclick=()=>{stop();player.remove();player=null;document.body.classList.remove('playing')};mark()}
 const btn=document.createElement('button');btn.type='button';btn.className='lsn';btn.innerHTML=I.spk+'<span>Listen</span>';
 document.querySelector('.rd .bar').appendChild(btn);
 btn.onclick=()=>{openPlayer();speakFrom(idx)};
 A.addEventListener('click',e=>{if(!player||e.target.closest('mark,a')||!getSelection().isCollapsed)return;
  const i=blocks.findIndex(b=>b.el===e.target.closest('p,h2,h3,h4,li,blockquote'));if(i>=0)speakFrom(i)});
 addEventListener('pagehide',()=>S.cancel());
})();
})();
</script></body></html>
