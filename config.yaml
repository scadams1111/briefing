# ─────────────────────────────────────────────────────────────
# Daily Briefing — configuration
# Edit freely. Dead feeds are skipped automatically and listed
# in docs/health.json so you can prune them.
# ─────────────────────────────────────────────────────────────

site_title: "The Daily Briefing"
# Leave blank on GitHub — it's worked out from the repo name.
site_url: ""

daily_picks: 10          # articles in each day's briefing
max_per_topic: 2         # so one busy topic can't take over the day
min_light_picks: 1       # at least this many from "light" topics
lookback_hours: 36       # ignore anything older
min_words: 600           # skip short news blurbs
candidates_per_topic: 6  # shortlist per topic sent to the AI for ranking
keep_days: 30            # archive pages / epubs kept

llm:
  provider: gemini
  # Preferred models, tried first. Any other Flash model your key can
  # use is found automatically and used as a backup when these are busy.
  models: ["gemini-3.1-flash-lite"]
  seconds_between_calls: 5   # stays under free-tier per-minute limits
  # Backup when Gemini is busy (needs the GROQ_API_KEY secret). Other models
  # your Groq key can use are found automatically.
  groq_models: ["openai/gpt-oss-120b", "llama-3.3-70b-versatile"]
  groq_seconds_between_calls: 3
  budget_minutes: 18         # stop using the AI after this long so the run always finishes

# Used when the READER_PROFILE secret isn't set. Keep this one
# generic because the repo is public; put the personal version
# in the secret (see README).
profile: >
  A curious, highly educated professional who wants to be well read:
  the important stories and best-written pieces of the day, with
  substance over hype.

hackernews:
  enabled: true
  min_points: 150
  topic: ai

# weight: how much this topic matters (1.0 = normal)
# kind: core | light   ("light" topics are fill-ins, at least min_light_picks/day)
# feeds: RSS/Atom URLs (add `weight:` per feed if one source is extra good)
# searches: news-search queries, good for niche topics without feeds
topics:
  - id: ai
    name: AI & Tech
    weight: 1.2
    kind: core
    feeds:
      - https://www.technologyreview.com/feed/
      - https://simonwillison.net/atom/everything/
      - https://www.understandingai.org/feed
      - https://www.oneusefulthing.org/feed
      - https://arstechnica.com/feed/
      - {url: https://www.theatlantic.com/feed/channel/technology/, name: The Atlantic, weight: 1.2}
      - https://www.techmeme.com/feed.xml
    searches: []

  - id: science
    name: Science & Medicine
    weight: 1.2
    kind: core
    feeds:
      - https://www.statnews.com/feed/
      - https://www.quantamagazine.org/feed/
      - {url: https://www.science.org/rss/news_current.xml, name: Science}
      - https://knowablemagazine.org/rss
      - {url: https://theconversation.com/us/articles.atom, name: The Conversation}
      - https://undark.org/feed/
      - https://www.nature.com/nature.rss
      - {url: https://www.theatlantic.com/feed/channel/health/, name: The Atlantic, weight: 1.2}
      - {url: https://www.theatlantic.com/feed/channel/science/, name: The Atlantic, weight: 1.2}
    searches: []

  - id: business
    name: Business & Economy
    weight: 1.0
    kind: core
    feeds:
      - https://www.noahpinion.blog/feed
      - https://www.axios.com/feeds/feed.rss
      - {url: https://www.economist.com/finance-and-economics/rss.xml, name: The Economist, weight: 1.2}
      - {url: https://www.theatlantic.com/feed/channel/business/, name: The Atlantic, weight: 1.2}
    searches: []

  - id: world
    name: World & Politics
    weight: 1.1
    kind: core
    feeds:
      - https://feeds.npr.org/1001/rss.xml
      - https://feeds.bbci.co.uk/news/world/rss.xml
      - {url: https://www.economist.com/international/rss.xml, name: The Economist, weight: 1.2}
      - {url: https://www.foreignaffairs.com/rss.xml, name: Foreign Affairs}
      - https://www.propublica.org/feeds/propublica/main
      - {url: https://www.theatlantic.com/feed/channel/politics/, name: The Atlantic, weight: 1.2}
      - {url: https://www.theatlantic.com/feed/channel/international/, name: The Atlantic, weight: 1.2}
    searches: []

  - id: biotech
    name: Biotech & Pharma
    weight: 1.2
    kind: core
    feeds:
      - https://www.fiercebiotech.com/rss/xml
      - https://endpts.com/feed/
      - https://www.biopharmadive.com/feeds/news/
    searches:
      - "San Diego biotech"

  - id: animal-research
    name: Animal Research Policy
    weight: 1.3
    kind: core
    feeds:
      - https://speakingofresearch.com/feed/
    searches:
      - "animal research NIH policy"
      - "new approach methodologies animal testing"
      - "FDA animal testing"
      - "laboratory animal welfare"

  - id: entrepreneurship
    name: Entrepreneurship
    weight: 0.9
    kind: core
    feeds:
      - http://www.aaronsw.com/2002/feeds/pgessays.rss
      - https://www.lennysnewsletter.com/feed
    searches:
      - "solo consulting business"

  - id: leadership
    name: Leadership & Management
    weight: 0.9
    kind: core
    feeds:
      - https://lethain.com/feeds.xml
      - https://charity.wtf/feed/
    searches:
      - "management leadership lessons"

  - id: outdoors
    name: Outdoors & Nature
    weight: 0.8
    kind: light
    feeds:
      - https://www.outsideonline.com/feed/
      - https://www.adventure-journal.com/feed/
      - https://www.backpacker.com/feed/
    searches: []

  - id: maker
    name: Maker & Hobbies
    weight: 0.8
    kind: light
    feeds:
      - https://hackaday.com/blog/feed/
      - https://petapixel.com/feed/
      - https://blog.adafruit.com/feed/
    searches: []

  - id: longform
    name: Longform & Ideas
    weight: 1.0
    kind: light
    feeds:
      - https://longreads.com/feed/
      - {url: https://www.theatlantic.com/feed/all/, name: The Atlantic, weight: 1.2}
      - {url: https://www.theguardian.com/world/series/the-long-read/rss, name: The Guardian Long Read, weight: 1.1}
      - {url: https://aeon.co/feed.rss, name: Aeon}
      - https://www.noemamag.com/feed/
      - https://asteriskmag.com/feed
      - https://nautil.us/feed/
      - https://www.themarginalian.org/feed/
      - {url: https://www.newyorker.com/feed/everything, name: The New Yorker, weight: 1.2}
    searches: []

  - id: parenting
    name: Parenting & Family
    weight: 0.8
    kind: light
    feeds:
      - https://parentdata.org/feed/
      - https://www.afterbabel.com/feed
      - {url: https://www.theatlantic.com/feed/channel/family/, name: The Atlantic, weight: 1.2}
    searches: []

# ─────────────────────────────────────────────────────────────
# Subscriber picks: paywalled sources you subscribe to. Only the
# headline feed is used (no article text is copied to your public
# site); each pick gets a one-line takeaway and opens on the
# publisher's site, where you're logged in.
# ─────────────────────────────────────────────────────────────
# Top publications. They get a ranking boost; when their page is
# paywalled (only a preview comes through), the story goes to the
# premium slide as a headline + takeaway instead of being dropped.
premium_domains: [theatlantic.com, newyorker.com, economist.com, nytimes.com, wsj.com,
                  ft.com, bloomberg.com, washingtonpost.com, wired.com, science.org,
                  nature.com, statnews.com, quantamagazine.org, propublica.org,
                  theguardian.com, aeon.co, foreignaffairs.com]
premium_bonus: 0.6

# The New York Times column (you subscribe). Headline feeds only; each pick
# gets a one-line takeaway and opens in the NYT app.
nyt:
  picks: 5
  feeds:
    - {url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml, name: The New York Times, topic: Top Stories}
    - {url: https://rss.nytimes.com/services/xml/rss/nyt/Science.xml, name: The New York Times, topic: Science}
    - {url: https://rss.nytimes.com/services/xml/rss/nyt/Health.xml, name: The New York Times, topic: Health}
    - {url: https://rss.nytimes.com/services/xml/rss/nyt/Business.xml, name: The New York Times, topic: Business}
    - {url: https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml, name: The New York Times, topic: Technology}
    - {url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml, name: The New York Times, topic: World}
    - {url: https://rss.nytimes.com/services/xml/rss/nyt/US.xml, name: The New York Times, topic: U.S.}
    - {url: https://rss.nytimes.com/services/xml/rss/nyt/Upshot.xml, name: The New York Times, topic: The Upshot}
    - {url: https://rss.nytimes.com/services/xml/rss/nyt/Magazine.xml, name: The New York Times, topic: Magazine}
    - {url: https://rss.nytimes.com/services/xml/rss/nyt/Opinion.xml, name: The New York Times, topic: Opinion}

# Premium picks: paywalled stories from the other top publications above.
premium:
  picks: 4

# ─────────────────────────────────────────────────────────────
# Get smarter: a daily deep dive (rotating across fields) with a
# Wikipedia-grounded primer + further reading, and a couple of
# evergreen explainers. Explainers come from a library that grows
# from the feeds below every day.
# ─────────────────────────────────────────────────────────────
smarter:
  enabled: true
  evergreen_picks: 2
  fields: [Biology, History, Economics, Psychology, Physics, Technology, Philosophy,
           Earth & Climate, Medicine, Mathematics, Engineering, Anthropology, Astronomy,
           Political Science, Chemistry, Art & Culture, Neuroscience, Ecology]
  evergreen_feeds:
    - {url: https://www.quantamagazine.org/feed/, name: Quanta}
    - {url: https://aeon.co/feed.rss, name: Aeon}
    - {url: https://psyche.co/feed, name: Psyche}
    - {url: https://knowablemagazine.org/rss, name: Knowable}
    - {url: https://nautil.us/feed/, name: Nautilus}
    - {url: https://www.themarginalian.org/feed/, name: The Marginalian}
    - {url: https://ourworldindata.org/atom.xml, name: Our World in Data}
    - {url: https://asteriskmag.com/feed, name: Asterisk}
    - {url: https://fs.blog/feed/, name: Farnam Street}
    - {url: https://bigthink.com/feed/, name: Big Think}
    - {url: https://www.noemamag.com/feed/, name: Noema}
    - {url: https://publicdomainreview.org/rss.xml, name: The Public Domain Review}
    - {url: https://www.smithsonianmag.com/rss/latest_articles/, name: Smithsonian}
    - {url: https://waitbutwhy.com/feed, name: Wait But Why}
    - {url: https://theconversation.com/us/articles.atom, name: The Conversation}
    - {url: https://undark.org/feed/, name: Undark}
    - {url: https://www.scientificamerican.com/platform/syndication/rss/, name: Scientific American}

# Audio briefing: read aloud each morning; also a podcast feed (docs/podcast.xml).
audio:
  enabled: true
  minutes: 9
  voice: en-US-AndrewMultilingualNeural   # e.g. en-US-AvaMultilingualNeural for a female voice
  rate: "+4%"
